name: Publish SDK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: 22.23.1
  PNPM_VERSION: 10.12.1

jobs:
  publish:
    name: Publish @booking-engine/sdk-typescript
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Install pinned npm
        run: npm install --global npm@11.5.1

      - name: Verify release toolchain
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          test "$(npm --version)" = "11.5.1"

      - name: Verify release tag and source
        run: |
          git fetch --no-tags --force origin main
          node scripts/check-release-invariants.mjs ref "${GITHUB_REF_NAME}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SDK build and release gates
        run: |
          pnpm build
          pnpm check:public-boundary
          pnpm check:public-contract
          pnpm check:sdk-package
          pnpm scan:secrets
          pnpm scan:history

      - name: Pack SDK
        env:
          RELEASE_DIR: ${{ runner.temp }}/booking-engine-sdk
        run: |
          mkdir -p "${RELEASE_DIR}"
          pnpm pack --filter @booking-engine/sdk-typescript --pack-destination "${RELEASE_DIR}"

      - name: Verify SDK tarball
        id: package
        env:
          RELEASE_DIR: ${{ runner.temp }}/booking-engine-sdk
        run: |
          release_tarball="$(node scripts/check-release-invariants.mjs artifact "${RELEASE_DIR}")"
          echo "tarball=${release_tarball}" >> "${GITHUB_OUTPUT}"

      - name: Reject an existing registry version
        run: node scripts/check-release-invariants.mjs unpublished

      - name: Publish SDK with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm publish "${RELEASE_TARBALL}" --access public --provenance --tag latest
